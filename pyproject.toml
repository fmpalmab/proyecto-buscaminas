[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "buscaminas-ai"
version = "2.0.0"
description = "Implementación moderna de Buscaminas con GUI Tkinter y Agentes IA (Linear Q-Learning y Deducción CSP)."
readme = "README.md"
authors = [
    { name = "Fernando Palma", email = "fernando.palma.b@ug.uchile.cl" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20.0",
    "matplotlib>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
buscaminas = "buscaminas.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["buscaminas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-v"
